<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS 2-Tier Notes</title><style>body{font-family:Arial;max-width:760px;margin:50px auto;padding:0 20px}form{display:flex;gap:10px;margin:20px 0}input{flex:1;padding:12px}button{padding:12px 18px}li{margin:12px 0;padding:12px;border:1px solid #ddd;border-radius:8px}</style></head><body><h1>AWS 2-Tier Notes App</h1><p>Flask runs on EC2 and persistent data is stored in Amazon RDS MySQL.</p><form method="post"><input name="message" placeholder="Write a note..." maxlength="255" required><button type="submit">Save</button></form><h2>Saved notes</h2><ul>{% for id,message,created_at in notes %}<li><strong>#{{id}}</strong> {{message}} <small>({{created_at}})</small></li>{% else %}<li>No notes yet.</li>{% endfor %}</ul></body></html>
